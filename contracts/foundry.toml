[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = [
    { access = "read", path = "./out" },
    { access = "read", path = "../config" },
    { access = "read", path = "../metadata" },
    { access = "read-write", path = "../deployments" },
]
gas_limit = 1_000_000_000

[profile.default.fuzz]
runs = 1000
seed = "0x4444"

[profile.default.invariant]
runs = 256
depth = 64

[profile.ci.fuzz]
runs = 10000

# B6 heavy campaign: FOUNDRY_PROFILE=invariant forge test --match-path "test/invariant/**"
# (10k runs per invariant; I-a, I-b, I-d and I-g raise runs to 100k with inline `invariant.invariant.runs`).
[profile.invariant.invariant]
runs = 10000
depth = 24
fail_on_revert = false
show_metrics = true

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
