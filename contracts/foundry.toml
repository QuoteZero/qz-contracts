[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
auto_detect_solc = false
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ffi = false
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "../config" }]
gas_limit = 1_000_000_000

[profile.default.fuzz]
runs = 1000
seed = "0x4444"

[profile.default.invariant]
runs = 256
depth = 64

[profile.ci.fuzz]
runs = 10000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
